# FindIt4You — nginx reverse proxy.
# Node backend on 127.0.0.1:4200 (no conflict: RaceScan 3000/4001/8500, TorchDoor 4000, jarvis 9000).
#
# This is the INITIAL http-only block. Install it, reload nginx, then run certbot
# (see deploy/DEPLOY.md) — `certbot --nginx` rewrites this file to add HTTPS + redirect.
#
# Replace DOMAIN with your real domain before installing.

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN www.DOMAIN;

    client_max_body_size 10m;   # headroom for future proof-photo uploads

    location / {
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ /\.ht { deny all; }
}
