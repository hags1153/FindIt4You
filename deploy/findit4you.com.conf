# FindIt4You — nginx reverse proxy for findit4you.com
# Node backend on 127.0.0.1:4200 (no conflict: RaceScan 3000/4001/8500, TorchDoor 4000, jarvis 9000).
#
# Install this http-only block, reload nginx, then run:
#   sudo certbot --nginx -d findit4you.com -d www.findit4you.com
# Certbot rewrites this file to add HTTPS (443) + the http->https redirect.

server {
    listen 80;
    listen [::]:80;
    server_name findit4you.com www.findit4you.com;

    client_max_body_size 10m;   # headroom for future proof-photo uploads

    location / {
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ /\.ht { deny all; }
}
